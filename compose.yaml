services:
  careerpilot:
    build:
      context: .
      dockerfile: Dockerfile
    image: careerpilot-ai:ihk-poc
    environment:
      CAREERPILOT_RUNTIME: node
      AI_PROVIDER: ${AI_PROVIDER:-rules}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-eu.amazon.nova-2-lite-v1:0}
      AI_STRICT_MODE: ${AI_STRICT_MODE:-false}
      PERSIST_UPLOADS: ${PERSIST_UPLOADS:-false}
    ports:
      - "8080:3000"
    restart: unless-stopped
